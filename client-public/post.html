<!DOCTYPE html>
<html lang="en" data-theme = "light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="public/output.css">
</head>
<body>
    <header class="navbar border-b border-base-300 px-6">
        <a href="index.html" class="text-sm">&larr; Back to all posts</a>
    </header>

    <main class="mx-auto max-w-2xl px-6 py-10">
        <article>
            <h1 id="post-title" class="text-3xl font-semibold mb-5"></h1>
            <p id="post-content" class="text-lg leading-relaxed whitespace-pre-line"></p>
        </article>

        <section class="mt-12">
            <h2 class="text-base font-semibold">Comments</h2>
            <ul id="comment-list" class="list bg-base-100 rounded-box shadow-md mt-4 mb-8"></ul>

            <form id="comment-form" class="flex flex-col gap-3">
                <textarea id="comment-content" required class="textarea textarea-primary w-full" placeholder="Write a comment"></textarea>
                <button type="submit" class="btn btn-success">Post comment</button>
            </form>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/post.js"></script>
</body>
</html>
